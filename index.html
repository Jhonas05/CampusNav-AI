<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint so there is no flash of the
      // wrong theme. Mirrors src/lib/theme.js (key "campusnav-theme").
      (function () {
        try {
          var stored = localStorage.getItem("campusnav-theme");
          var preference = stored === "light" || stored === "dark" ? stored : "system";
          var dark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0A0A0A" : "#FFFFFF");
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) root.classList.add("motion-ok");
        } catch (error) {}
      })();
    </script>
    <meta name="application-name" content="CampusNav AI" />
    <meta name="author" content="CampusNav AI" />
